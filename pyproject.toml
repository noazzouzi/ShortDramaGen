[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shortdramagen"
version = "0.1.0"
description = "Récupère automatiquement tous les épisodes d'une série DramaBox à partir d'une URL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sdg = "shortdramagen.cli:main"

[tool.setuptools.packages.find]
include = ["shortdramagen*"]
